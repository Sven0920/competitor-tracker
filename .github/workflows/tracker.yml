name: Daily Competitor Tracker

on:
  schedule:
    # GitHub is most likely to skip or delay a job that starts on the hour, so this stays off :00. Once a day.
    - cron: '17 2 * * *'   # 02:17 UTC, about 10:17 China time
  workflow_dispatch:        # Run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape new competitor games
        # Feishu is off. Do not pass FEISHU_WEBHOOK into the daily job. The secret stays in the repo and is unused.
        # An incomplete scrape must still succeed so the commit step can keep the data already collected.
        run: python competitor_tracker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor_list.json data.json installs_history.json
          git diff --staged --quiet || git commit -m "data: update competitor games $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
