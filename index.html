<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Game Radar</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73;
    --line:#d2d2d7; --accent:#0071e3; --soft:#f5f5f7;
    --ios:#0a84ff; --android:#1d8a44; --soft-tag:#c2410c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    padding:40px 20px;
  }
  .wrap{max-width:760px;margin:0 auto}
  .title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
  .meta{color:var(--sub);font-size:13px;margin:0 0 22px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
  .seg{display:inline-flex;background:#e9e9ec;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  select,input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  input{flex:1;min-width:140px}
  .daygroup{margin-bottom:26px}
  .dayhead{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 10px;position:sticky;top:0;background:var(--bg);padding:4px 0}
  .game{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);
    display:flex;gap:14px;align-items:flex-start;
  }
  .g-icon{width:56px;height:56px;border-radius:14px;flex:0 0 56px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
  .g-icon.ph{display:flex;align-items:center;justify-content:center;font-size:26px}
  .g-body{flex:1;min-width:0}
  .g-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .plat{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff}
  .plat.ios{background:var(--ios)}
  .plat.android{background:var(--android)}
  .dev{font-size:12px;font-weight:600;color:var(--accent);background:#eaf3ff;padding:2px 8px;border-radius:6px}
  .found{font-size:12px;color:var(--sub);background:var(--soft);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
  .tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
  .tag.soft{color:#fff;background:var(--soft-tag)}
  .tag.live{color:var(--android);background:#e9f6ee}
  .tag.hot{color:#fff;background:#ea580c}
  .tag.pre{color:#fff;background:#7c3aed}
  .tag.back{color:#3f3f46;background:#e4e4e7}
  .sectionhead{font-size:15px;font-weight:700;margin:8px 0 12px}
  .genre{font-size:12px;color:#6b21a8;background:#f3e8ff;padding:2px 8px;border-radius:6px}
  .vel{color:#ea580c;font-weight:600}
  .shotbtn{margin-top:10px;font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
  .shots{display:none;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
  .shots.open{display:flex}
  .shots img{height:130px;border-radius:8px;border:1px solid var(--line);flex:0 0 auto}
  .g-name{font-size:17px;font-weight:600;margin:10px 0 6px;line-height:1.3}
  .g-name a{color:var(--ink);text-decoration:none}
  .g-name a:hover{color:var(--accent)}
  .g-links{font-size:13px;margin:-2px 0 6px}
  .g-links a{color:var(--accent);text-decoration:none;margin-right:12px}
  .g-info{font-size:13px;color:var(--sub);line-height:1.7}
  .g-info b{color:var(--ink);font-weight:600}
  .empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:15px}
  .count{font-size:13px;color:var(--sub);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">📡 New Game Radar</h1>
  <p class="meta" id="meta">加载中…</p>

  <div class="bar">
    <div class="seg" id="platSeg">
      <button data-p="all" class="on">全部</button>
      <button data-p="iOS">🍎 iOS</button>
      <button data-p="Android">🤖 Android</button>
    </div>
    <select id="devSel"><option value="all">全部厂商</option></select>
    <select id="genreSel"><option value="all">全部品类</option></select>
    <select id="signalSel">
      <option value="all">全部信号</option>
      <option value="soft">🔥 软启动</option>
      <option value="hot">🔥 起量快</option>
      <option value="pre">🔜 预售</option>
      <option value="fresh">刚上架</option>
      <option value="backfill">补录</option>
    </select>
    <select id="ageSel">
      <option value="all">上架时间不限</option>
      <option value="7">上架 7 天内</option>
      <option value="14">上架 14 天内</option>
      <option value="30">上架 30 天内</option>
      <option value="90">上架 90 天内</option>
    </select>
    <select id="sortSel">
      <option value="found_desc">最近发现 ↓</option>
      <option value="velocity_desc">增速 ↓（7天装机）</option>
      <option value="installs_desc">装机量 ↓（安卓）</option>
      <option value="rel_desc">上架时间 ↓（新→旧）</option>
      <option value="rel_asc">上架时间 ↑（旧→新）</option>
      <option value="dev_az">厂商 A→Z</option>
      <option value="name_az">游戏名 A→Z</option>
    </select>
    <input id="search" type="search" placeholder="搜索游戏名或厂商…">
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
</div>

<script>
var GAMES = [];
var HOT_IDS = new Set();
var filter = { plat:"all", dev:"all", genre:"all", signal:"all", age:"all", q:"", sort:"found_desc" };

// 上架日期解析：ISO("2026-08-19") 按 UTC、美式("Aug 19, 2026") 按本地时区，混排会产生 8 小时偏差
// 统一归一到 UTC 的「日」，让同一天的 iOS / Android 真正等价
const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseDay(s){
  s = String(s||"").trim();
  if(!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return Date.UTC(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if(m && MONTHS[m[1].toLowerCase()] !== undefined) return Date.UTC(+m[3], MONTHS[m[1].toLowerCase()], +m[2]);
  const t = Date.parse(s);
  return isNaN(t) ? null : t;
}
const isPreorder = g => { const t = parseDay(g.release_date); return t !== null && t > Date.now(); };
const FRESH_DAYS = 30; // 和脚本里的 FRESH_PUSH_DAYS 对齐：发现时上架已超过这个天数就是补录
const HOT_RANK = 10;    // 起量快 = 当天 7 日增速前 10，不再用固定 10000
function isBackfill(g){
  if(typeof g.backfill === "boolean") return g.backfill;
  const rel = parseDay(g.release_date);
  const found = parseDay(g.found_date);
  if(rel === null) return true;
  const ref = found === null ? Date.now() : found;
  return (ref - rel) / 86400000 > FRESH_DAYS;
}
function hasUs(g){
  return (g.regions||[]).some(r => String(r).toLowerCase() === "us");
}
function normName(s){
  return String(s||"").trim().toLowerCase().replace(/\s+/g, " ");
}
function hotAppIds(games){
  const ranked = (games||[])
    .filter(g => g.platform === "Android" && (g.velocity||0) > 0)
    .sort((a,b) => (b.velocity||0) - (a.velocity||0) || String(a.app_id||"").localeCompare(String(b.app_id||"")));
  return new Set(ranked.slice(0, HOT_RANK).map(g => g.app_id));
}
const installsNum = g => parseInt(String(g.installs||"").replace(/[^\d]/g,""), 10) || 0;

function makeCard(sides){
  const releaseTs = sides.map(s => parseDay(s.release_date)).filter(t => t !== null);
  return {
    name: sides[0].name,
    developer: sides[0].developer || "",
    sides,
    found_date: sides.map(s => s.found_date||"").sort().pop() || "",
    genres: [...new Set(sides.map(s => s.genre).filter(Boolean))],
    backfill: sides.every(isBackfill),
    preorder: sides.some(isPreorder),
    hot: sides.some(s => HOT_IDS.has(s.app_id)),
    soft: sides.some(s => !hasUs(s)),
    newestRelease: releaseTs.length ? Math.max(...releaseTs) : null,
    velocity: Math.max(0, ...sides.map(s => s.velocity||0)),
    installs: Math.max(0, ...sides.map(installsNum)),
  };
}

function mergeGames(games){
  const groups = new Map();
  for(const g of games || []){
    const key = (g.developer||"") + "\0" + normName(g.name);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(g);
  }
  const cards = [];
  for(const items of groups.values()){
    const ios = items.filter(g => g.platform === "iOS");
    const android = items.filter(g => g.platform === "Android");
    if(ios.length && android.length){
      const pick = list => list.slice().sort((a,b) => (b.found_date||"").localeCompare(a.found_date||""))[0];
      const chosen = [pick(ios), pick(android)];
      const used = new Set(chosen.map(g => g.app_id));
      cards.push(makeCard(chosen));
      items.filter(g => !used.has(g.app_id)).forEach(g => cards.push(makeCard([g])));
    } else {
      items.forEach(g => cards.push(makeCard([g])));
    }
  }
  return cards;
}

function cardAgeDays(card, now){
  if(card.newestRelease === null) return null;
  return ((now || Date.now()) - card.newestRelease) / 86400000;
}

function cardMatches(card, f, now){
  const q = f.q || "";
  const ageLimit = f.age === "all" ? null : Number(f.age);
  const age = cardAgeDays(card, now);
  return (f.plat === "all" || card.sides.some(s => s.platform === f.plat)) &&
    (f.dev === "all" || card.developer === f.dev) &&
    (f.genre === "all" || card.sides.some(s => (s.genre||"") === f.genre)) &&
    (!q || normName(card.name).includes(q) || normName(card.developer).includes(q)) &&
    (f.signal === "all"
      || (f.signal === "soft" && card.soft)
      || (f.signal === "hot" && card.hot)
      || (f.signal === "pre" && card.preorder)
      || (f.signal === "fresh" && !card.backfill)
      || (f.signal === "backfill" && card.backfill)) &&
    (ageLimit === null || (age !== null && age <= ageLimit));
}

const byDate = dir => (a,b) => {
  const x = a.newestRelease, y = b.newestRelease;
  if(x === null && y === null) return (a.found_date||"").localeCompare(b.found_date||"");
  if(x === null) return 1;
  if(y === null) return -1;
  return dir * (y - x) || (b.found_date||"").localeCompare(a.found_date||"");
};
const SORTERS = {
  found_desc:    (a,b) => (b.found_date||"").localeCompare(a.found_date||"") || (a.developer||"").localeCompare(b.developer||""),
  velocity_desc: (a,b) => (b.velocity||0) - (a.velocity||0),
  installs_desc: (a,b) => (b.installs||0) - (a.installs||0),
  rel_desc:      byDate(1),
  rel_asc:       byDate(-1),
  dev_az:        (a,b) => (a.developer||"").localeCompare(b.developer||"") || (b.found_date||"").localeCompare(a.found_date||""),
  name_az:       (a,b) => (a.name||"").localeCompare(b.name||""),
};

const esc = s => String(s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function regionTag(regions){
  const live = (regions||[]).map(r=>String(r).toLowerCase()).includes("us");
  return live
    ? '<span class="tag live">✅ US 上架</span>'
    : '<span class="tag soft">🔥 Soft Launch</span>';
}

function sideLine(g){
  const regions = esc((g.regions||[]).map(r=>String(r).toUpperCase()).join(", ") || "—");
  const stats = g.platform === "Android"
    ? `📥 安装 <b>${esc(g.installs||"—")}</b>${(g.velocity||0)>0 ? ` &nbsp;·&nbsp; 📈 <span class="vel">7天 +${(g.velocity||0).toLocaleString()}</span>` : ""}`
    : `⭐ 评分 <b>${(g.ratings||0).toLocaleString()}</b>`;
  // 安卓包体几乎都是「因设备而异」，不再占一行。iOS 包体仍有用。
  const size = g.platform === "Android" ? "" : ` &nbsp;·&nbsp; 📦 <b>${esc(g.size||"—")}</b>`;
  return `<div class="g-info">🌍 ${regions} &nbsp;·&nbsp; ${stats}${size} &nbsp;·&nbsp; 💰 ${esc(g.iap_info||"—")} &nbsp;·&nbsp; 🗓 上架 <b>${esc(g.release_date||"—")}</b></div>`;
}

function gameCard(card){
  const shots = card.sides.flatMap(s => (s.shots||[]).filter(Boolean)).slice(0, 8);
  const icon = card.sides.map(s => s.icon).find(Boolean);
  const platTags = card.sides.map(s =>
    `<span class="plat ${s.platform==='iOS'?'ios':'android'}">${s.platform==='iOS'?'🍎 iOS':'🤖 Android'}</span>${regionTag(s.regions)}`
  ).join("");
  const nameHtml = card.sides.length === 1
    ? `<a href="${esc(card.sides[0].url)}" target="_blank" rel="noopener">${esc(card.name)}</a>`
    : esc(card.name);
  const links = card.sides.length > 1
    ? `<div class="g-links">${card.sides.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${s.platform==='iOS'?'App Store':'Google Play'}</a>`).join("")}</div>`
    : "";
  return `
    <div class="game">
      ${icon
        ? `<img class="g-icon" src="${esc(icon)}" loading="lazy" alt="" onerror="this.outerHTML='<div class=&quot;g-icon ph&quot;>🎮</div>'">`
        : `<div class="g-icon ph">🎮</div>`}
      <div class="g-body">
        <div class="g-top">
          ${platTags}
          <span class="dev">${esc(card.developer)}</span>
          ${card.genres.map(g => `<span class="genre">${esc(g)}</span>`).join("")}
          ${card.hot ? '<span class="tag hot">🔥 起量快</span>' : ''}
          ${card.preorder ? '<span class="tag pre">🔜 预售</span>' : ''}
          ${card.backfill ? '<span class="tag back">补录</span>' : ''}
          <span class="found">🔎 发现 ${esc(card.found_date||"—")}</span>
        </div>
        <div class="g-name">${nameHtml}</div>
        ${links}
        ${card.sides.map(sideLine).join("")}
        ${shots.length ? `<button class="shotbtn" onclick="this.nextElementSibling.classList.toggle('open')">🖼 截图 (${shots.length})</button>
        <div class="shots">${shots.map(s=>`<img loading="lazy" src="${esc(s)}" alt="">`).join('')}</div>` : ''}
      </div>
    </div>`;
}

function visibleCards(){
  return mergeGames(GAMES).filter(card => cardMatches(card, filter));
}

function render(){
  const list = document.getElementById('list');
  let rows = visibleCards();
  document.getElementById('count').textContent = rows.length ? rows.length + " 张" : "";

  if(!rows.length){
    list.innerHTML = '<div class="empty">😴 没有符合条件的新游</div>';
    return;
  }

  rows = rows.slice().sort(SORTERS[filter.sort] || SORTERS.found_desc);

  function dayGroups(items){
    const groups = [];
    let last = null;
    for(const g of items){
      const d = g.found_date || "未知日期";
      if(d !== last){ groups.push({d, items:[]}); last = d; }
      groups[groups.length-1].items.push(g);
    }
    return groups.map(gr =>
      `<div class="daygroup"><div class="dayhead">${esc(gr.d)} · ${gr.items.length} 张</div>${gr.items.map(gameCard).join("")}</div>`
    ).join("");
  }

  if(filter.sort === "found_desc"){
    const fresh = rows.filter(g => !g.backfill);
    const back = rows.filter(g => g.backfill);
    const parts = [];
    if(fresh.length) parts.push(`<div class="sectionhead">刚上架 · ${fresh.length} 张</div>${dayGroups(fresh)}`);
    if(back.length) parts.push(`<div class="sectionhead">补录 · ${back.length} 张</div>${dayGroups(back)}`);
    list.innerHTML = parts.join("");
  } else {
    list.innerHTML = rows.map(gameCard).join("");
  }
}

function buildDevOptions(){
  const devs = [...new Set(GAMES.map(g=>g.developer))].sort();
  const sel = document.getElementById('devSel');
  devs.forEach(d => {
    const o = document.createElement('option'); o.value=d; o.textContent=d; sel.appendChild(o);
  });
}

function buildGenreOptions(){
  const genres = [...new Set(GAMES.map(g=>g.genre).filter(Boolean))].sort();
  const sel = document.getElementById('genreSel');
  genres.forEach(d => {
    const o = document.createElement('option'); o.value=d; o.textContent=d; sel.appendChild(o);
  });
}

document.getElementById('platSeg').addEventListener('click', e => {
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
  filter.plat = e.target.dataset.p; render();
});
document.getElementById('devSel').addEventListener('change', e => { filter.dev = e.target.value; render(); });
document.getElementById('genreSel').addEventListener('change', e => { filter.genre = e.target.value; render(); });
document.getElementById('signalSel').addEventListener('change', e => { filter.signal = e.target.value; render(); });
document.getElementById('ageSel').addEventListener('change', e => { filter.age = e.target.value; render(); });
document.getElementById('sortSel').addEventListener('change', e => { filter.sort = e.target.value; render(); });
document.getElementById('search').addEventListener('input', e => { filter.q = e.target.value.toLowerCase().trim(); render(); });

fetch('data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    GAMES = data.games || [];
    HOT_IDS = hotAppIds(GAMES);
    document.getElementById('meta').textContent =
      `共监控中 · 最近 120 天发现 ${GAMES.length} 款新游 · 数据更新于 ${data.updated_at || "—"}（每天自动）`;
    buildDevOptions();
    buildGenreOptions();
    render();
  })
  .catch(() => {
    document.getElementById('meta').textContent = '⚠️ 暂无数据（首次运行后会自动生成 data.json）';
    document.getElementById('list').innerHTML = '<div class="empty">等待首次自动抓取…</div>';
  });
</script>
</body>
</html>
